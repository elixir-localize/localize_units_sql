name: Elixir CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test
  PGHOST: localhost
  PGUSER: postgres
  PGPASSWORD: postgres

permissions:
  contents: read

jobs:
  test:
    name: "Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}${{ matrix.lint && ' (lint)' || '' }}"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include:
          # Every row pins the latest patch of its Elixir minor and its OTP
          # major, verified against the release tags. Bump every row that
          # uses a version in the same change, never one at a time.

          # Elixir 1.17 — supports OTP 25–27
          - elixir: "1.17.3-otp-26"
            otp: "26.2.5.21"
          - elixir: "1.17.3-otp-27"
            otp: "27.3.4.19"

          # Elixir 1.18 — supports OTP 25–27
          - elixir: "1.18.6-otp-26"
            otp: "26.2.5.21"
          - elixir: "1.18.6-otp-27"
            otp: "27.3.4.19"

          # Elixir 1.19 — supports OTP 26–28
          - elixir: "1.19.7-otp-26"
            otp: "26.2.5.21"
          - elixir: "1.19.7-otp-27"
            otp: "27.3.4.19"
          - elixir: "1.19.7-otp-28"
            otp: "28.5.0.8"

          # Elixir 1.20 — supports OTP 27–29
          - elixir: "1.20.5-otp-27"
            otp: "27.3.4.19"
          - elixir: "1.20.5-otp-28"
            otp: "28.5.0.8"
          - elixir: "1.20.5-otp-29"
            otp: "29.1.2"
            lint: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      # Postgrex is compiled against db_connection, so every dependency is
      # compiled before the forced rebuild below. Without this the rebuild
      # fails on a cold cache — `mix deps.get` fetches db_connection but
      # does not compile it, and Postgrex cannot load DBConnection.Query.
      - name: Compile dependencies
        run: mix deps.compile

      # Postgrex reads :json_library from the config when it is compiled,
      # and a restored _build may hold a Postgrex compiled with another one.
      - name: Compile Postgrex with the configured JSON library
        run: mix deps.compile postgrex --force

      - name: Check formatting
        if: matrix.lint
        run: mix format --check-formatted

      - name: Run credo
        if: matrix.lint
        run: mix credo --strict

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        if: ${{ !matrix.lint }}
        run: mix test

      - name: Run tests with coverage
        if: matrix.lint
        run: mix test --cover

      - name: Build docs (warnings as errors)
        if: matrix.lint
        env:
          MIX_ENV: release
        run: mix docs --warnings-as-errors

      - name: Restore PLT cache
        if: matrix.lint
        uses: actions/cache@v6
        with:
          path: _build/dev/dialyxir_*
          key: plt-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Run dialyzer
        if: matrix.lint
        env:
          MIX_ENV: dev
        run: mix dialyzer
